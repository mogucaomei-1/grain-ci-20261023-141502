<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#070706">
  <title>GRAIN 1.1</title>
  <style>
    :root {
      --black:#070706; --surface:#131311; --raised:#1d1d1a;
      --paper:#f4ede1; --muted:#8e8b84; --line:rgba(255,255,255,.09);
      --accent:#d9774e; --filter:saturate(.9) contrast(.95) sepia(.08) brightness(1.03);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;background:#050505;color:var(--paper);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Helvetica Neue",sans-serif}
    body{display:grid;place-items:center;min-height:100svh;overflow:hidden}
    body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 82% 2%,rgba(217,119,78,.11),transparent 30%),#050505}
    button,input{font:inherit}
    button{color:inherit}
    .phone{position:relative;width:min(430px,100vw);height:min(932px,100svh);overflow:hidden;background:var(--black);border-radius:44px;box-shadow:0 40px 100px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.12)}
    .status{height:34px;padding:8px 23px 0;display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700}
    .screen{height:calc(100% - 34px);display:flex;flex-direction:column}
    .topbar{height:54px;flex:none;padding:0 18px;display:flex;align-items:center;gap:10px}
    .mark{width:34px;height:29px;position:relative}
    .mark:before{content:"";position:absolute;left:5px;top:9px;width:27px;height:16px;border-radius:4px;background:var(--paper)}
    .mark .bump{position:absolute;left:12px;top:5px;width:11px;height:7px;border-radius:3px;background:var(--paper)}
    .mark .lens{position:absolute;z-index:2;left:19px;top:17px;width:14px;height:14px;border:3px solid var(--black);border-radius:50%;transform:translate(-50%,-50%);background:#25251f;box-shadow:inset 0 0 0 2px #43848a}
    .mark .shutter{position:absolute;z-index:3;width:4px;height:4px;border-radius:50%;background:var(--accent);right:3px;top:12px}
    .brand strong{display:block;font-size:14px;letter-spacing:2.1px;font-weight:900;line-height:1}
    .top-actions{margin-left:auto;display:flex;gap:9px}
    .round{width:38px;height:38px;border-radius:50%;border:0;background:var(--raised);display:grid;place-items:center;font-size:14px;cursor:pointer}
    .round.export{background:var(--paper);color:var(--black);font-weight:900}
    .workspace{flex:1;min-height:0;display:flex;flex-direction:column}
    .photo{flex:1;min-height:0;margin:0 12px;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
    .image-box{position:relative;width:100%;aspect-ratio:3/2;max-height:100%}
    .photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:var(--filter);transition:filter .2s ease,opacity .12s ease}
    .photo img.original{filter:none;opacity:0}
    .photo.holding img.original{opacity:1}
    .photo-top,.photo-bottom{position:absolute;left:13px;right:13px;z-index:2;display:flex;justify-content:space-between;align-items:center}
    .photo-top{top:13px}.photo-bottom{bottom:13px}
    .histogram{position:absolute;z-index:3;right:8px;top:14px;width:82px;height:46px;border-radius:9px;background:rgba(0,0,0,.52);border:1px solid rgba(255,255,255,.15);padding:4px;backdrop-filter:blur(8px)}
    .histogram svg{width:100%;height:100%}
    .pill{height:27px;border-radius:999px;background:rgba(0,0,0,.52);padding:0 10px;display:flex;align-items:center;font-size:8px;font-weight:700;letter-spacing:.5px;backdrop-filter:blur(8px)}
    .pill.active{color:var(--paper)}
    .spinner{width:13px;height:13px;border:1.5px solid rgba(255,255,255,.25);border-top-color:var(--paper);border-radius:50%;animation:spin .8s linear infinite;opacity:0}
    .photo.loading .spinner{opacity:1}
    @keyframes spin{to{transform:rotate(360deg)}}
    .filmbar{height:100px;flex:none;padding-top:8px}
    .section-head{height:20px;padding:0 18px;display:flex;align-items:center;gap:8px}
    .section-head b{font:800 8px/1 ui-monospace,Menlo,monospace;letter-spacing:1.5px;color:var(--muted)}
    .section-head span{font-size:10px;font-weight:650}
    .film-actions{margin-left:auto;display:flex;align-items:center;gap:5px}
    .film-actions button{border:0;background:none;color:var(--muted);font-size:13px;cursor:pointer}
    .film-actions .recommend{height:24px;padding:0 9px;border-radius:999px;background:rgba(217,119,78,.1);color:var(--accent);font-size:9px;font-weight:650}
    .films{display:flex;gap:5px;overflow-x:auto;padding:6px 16px 0;scrollbar-width:none}
    .films::-webkit-scrollbar{display:none}
    .film{flex:0 0 auto;border:0;background:transparent;padding:4px;border-radius:13px;width:80px;cursor:pointer}
    .film.active{background:var(--raised);box-shadow:inset 0 0 0 1px rgba(217,119,78,.8)}
    .film .swatch{width:71px;height:49px;border-radius:9px;padding:7px;display:flex;align-items:flex-end;color:white;font:800 7.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.7px;box-shadow:inset 0 -24px 25px rgba(0,0,0,.32)}
    .film .name{margin-top:6px;width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:9.5px;text-align:left}
    .film.active .name{color:var(--paper);font-weight:650}
    .controls{height:146px;flex:none;background:var(--surface);border-top:1px solid var(--line);padding:8px 18px 12px}
    .categories{display:flex;align-items:center;gap:22px;height:25px}
    .category{border:0;background:none;color:var(--muted);font-size:10.5px;font-weight:650;padding:0 0 5px;cursor:pointer}
    .category.active{color:var(--paper);box-shadow:inset 0 -2px 0 var(--accent)}
    .tool-row{height:34px;display:flex;align-items:center;gap:7px;overflow-x:auto;scrollbar-width:none}
    .tool-row::-webkit-scrollbar{display:none}
    .tool{display:none;height:27px;flex:none;border:0;border-radius:999px;background:var(--raised);color:var(--muted);font-size:9.5px;font-weight:650;padding:0 13px;cursor:pointer}
    .tool.show{display:block}.tool.active{background:var(--paper);color:var(--black)}
    .slider-row{height:38px;display:flex;align-items:center;gap:12px}
    input[type=range]{appearance:none;width:100%;height:22px;background:transparent}
    input[type=range]::-webkit-slider-runnable-track{height:2px;border-radius:2px;background:linear-gradient(90deg,var(--accent) 0 var(--p,50%),rgba(255,255,255,.14) var(--p,50%))}
    input[type=range]::-webkit-slider-thumb{appearance:none;width:11px;height:11px;margin-top:-4.5px;border-radius:50%;background:var(--paper);box-shadow:0 0 0 3px rgba(244,237,225,.08)}
    output{width:52px;text-align:right;font:600 9px/1 ui-monospace,Menlo,monospace}
    .home-indicator{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);height:5px;width:134px;border-radius:5px;background:rgba(255,255,255,.7);z-index:10}
    .overlay{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.66);display:none}
    .sheet{position:absolute;z-index:21;left:0;right:0;bottom:0;border-radius:28px 28px 0 0;background:#11110f;border-top:1px solid rgba(255,255,255,.1);padding:11px 20px 34px;transform:translateY(105%);transition:.32s cubic-bezier(.22,.8,.2,1)}
    .sheet-open .overlay{display:block}.sheet-open .sheet{transform:translateY(0)}
    .grab{width:34px;height:4px;border-radius:4px;background:rgba(255,255,255,.23);margin:0 auto 17px}
    .sheet-title{display:flex;align-items:flex-start}
    .sheet-title h2{font:700 25px/1 "Iowan Old Style","Songti SC",serif;margin:0 0 4px}
    .sheet-title p{font-size:9px;color:var(--muted);margin:0}
    .close{margin-left:auto;border:0;width:30px;height:30px;border-radius:50%;background:var(--raised);cursor:pointer}
    .facts{margin:16px 0;padding:12px 0;background:var(--surface);border-radius:16px;display:flex;align-items:center}
    .fact{flex:1;text-align:center}.fact strong{display:block;font:650 10px/1.3 ui-monospace,Menlo,monospace}.fact span{display:block;font-size:8px;color:var(--muted);margin-top:3px}
    .sep{height:30px;width:1px;background:var(--line)}
    .formats{display:flex;gap:9px;margin-bottom:13px}
    .format{flex:1;padding:12px;text-align:left;border-radius:14px;background:var(--surface);border:1px solid var(--line);cursor:pointer}
    .format.active{border-color:var(--accent)}
    .format strong{font:700 12px/1 ui-monospace,Menlo,monospace}.format span{display:block;font-size:8.5px;color:var(--muted);margin-top:4px}
    .toggle-row{height:51px;display:flex;align-items:center;border-top:1px solid var(--line)}
    .toggle-row div{flex:1}.toggle-row strong{display:block;font-size:11px}.toggle-row small{display:block;font-size:8px;color:var(--muted);margin-top:3px}
    .switch{position:relative;width:41px;height:24px}.switch input{opacity:0;width:0;height:0}.switch i{position:absolute;inset:0;border-radius:20px;background:rgba(255,255,255,.13)}.switch i:after{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;border-radius:50%;background:white;transition:.2s}.switch input:checked+i{background:var(--accent)}.switch input:checked+i:after{transform:translateX(17px)}
    .export-btn{width:100%;height:51px;border:0;border-radius:15px;background:var(--paper);color:var(--black);margin-top:14px;display:flex;align-items:center;gap:9px;padding:0 16px;font-size:13px;font-weight:800;cursor:pointer}
    .export-btn small{margin-left:auto;font:800 8px/1 ui-monospace,Menlo,monospace;color:rgba(0,0,0,.5)}
    input[type=file]{display:none}
    @media(max-width:560px){body{display:block;background:var(--black)}body:before{display:none}.phone{width:100vw;height:100svh;border-radius:0;box-shadow:none}}
  </style>
</head>
<body>
  <div class="phone" id="phone">
    <div class="status"><span>16:40</span><span>••••　▮▮▮　⌁</span></div>
    <div class="screen">
      <header class="topbar">
        <button class="round" id="backHome" style="background:transparent;font-size:20px">‹</button>
        <div class="mark"><i class="bump"></i><i class="lens"></i><i class="shutter"></i></div>
        <div class="brand"><strong>GRAIN</strong></div>
        <div class="top-actions">
          <button class="round" id="filesButton" title="从文件导入">⌑</button>
          <button class="round" id="histogramButton" title="显示或隐藏直方图" style="color:var(--accent)">▥</button>
          <button class="round" id="infoButton" title="查看图片信息">ⓘ</button>
          <button class="round export" id="openExport">↗</button>
        </div>
        <input id="fileInput" type="file" accept=".arw,.ARW,.dng,.DNG,image/*">
      </header>

      <main class="workspace">
        <section class="photo" id="photo">
          <div class="image-box" id="imageBox">
            <img id="editedPhoto" src="GRAIN-demo.jpg" alt="Sony ZV-E10 照片">
            <img id="originalPhoto" class="original" src="GRAIN-demo.jpg" alt="原始照片">
            <div class="photo-top"><span class="pill">RAW · ZV-E10</span><span class="spinner"></span></div>
            <div class="histogram" aria-label="图像直方图"><svg viewBox="0 0 76 38" preserveAspectRatio="none"><path d="M1 37 L6 36 10 31 14 20 19 15 24 19 29 27 34 31 39 18 44 7 49 12 54 26 59 31 64 28 70 34 75 37Z" fill="rgba(255,255,255,.2)"/><path d="M1 36 10 31 18 17 25 22 34 29 43 8 51 20 60 31 69 28 75 36" fill="none" stroke="rgba(255,88,73,.8)" stroke-width="1"/><path d="M1 35 9 28 17 23 25 17 33 25 41 14 50 24 58 29 66 25 75 35" fill="none" stroke="rgba(104,226,160,.7)" stroke-width="1"/><path d="M1 37 10 33 17 24 25 20 33 11 41 17 49 29 57 30 66 27 75 37" fill="none" stroke="rgba(84,205,255,.78)" stroke-width="1"/></svg></div>
            <div class="photo-bottom"><span class="pill" id="profilePill">柯达 波特拉 400</span><span class="pill" id="holdOriginal">按住看原片</span></div>
          </div>
        </section>

        <section class="filmbar">
          <div class="section-head"><b>胶片</b><span id="filmName">柯达 波特拉 400</span><div class="film-actions"><button id="copyPreset" title="复制预设">⧉</button><button id="pastePreset" title="粘贴预设">▣</button><button class="recommend" id="recommend">✦ 推荐</button><button id="reset">↺</button></div></div>
          <div class="films" id="films">
            <button class="film" data-profile="neutral"><span class="swatch" style="background:linear-gradient(135deg,#8b8d8a,#b7b3a9,#dfd8cb)">原图</span><span class="name">原图</span></button>
            <button class="film active" data-profile="portra"><span class="swatch" style="background:linear-gradient(135deg,#b86f58,#d6aa86,#eadcc7)">波特拉</span><span class="name">柯达 波特拉 400</span></button>
            <button class="film" data-profile="film135t"><span class="swatch" style="background:linear-gradient(135deg,#254b66,#4f8a86,#d8c0a2)">135T</span><span class="name">135T 街拍</span></button>
            <button class="film" data-profile="portra160"><span class="swatch" style="background:linear-gradient(135deg,#b77a66,#d9b08f,#eee0cc)">P160</span><span class="name">柯达 波特拉 160</span></button>
            <button class="film" data-profile="portra800"><span class="swatch" style="background:linear-gradient(135deg,#aa614d,#d1a27c,#e8c8a9)">P800</span><span class="name">柯达 波特拉 800</span></button>
            <button class="film" data-profile="pro400h"><span class="swatch" style="background:linear-gradient(135deg,#5f7f79,#aabdb0,#dddcc7)">400H</span><span class="name">富士 专业 400H</span></button>
            <button class="film" data-profile="gold"><span class="swatch" style="background:linear-gradient(135deg,#a84a31,#d79d54,#e9d3a2)">金200</span><span class="name">柯达 金 200</span></button>
            <button class="film" data-profile="ektar100"><span class="swatch" style="background:linear-gradient(135deg,#8f3e34,#c47d56,#86a9a2)">艾克塔</span><span class="name">柯达 艾克塔 100</span></button>
            <button class="film" data-profile="chrome"><span class="swatch" style="background:linear-gradient(135deg,#344a49,#7f8b82,#b9b5a7)">经典</span><span class="name">富士 经典正片</span></button>
            <button class="film" data-profile="velvia50"><span class="swatch" style="background:linear-gradient(135deg,#1f6654,#c95346,#e5b95e)">维尔维亚</span><span class="name">富士 维尔维亚 50</span></button>
            <button class="film" data-profile="provia100f"><span class="swatch" style="background:linear-gradient(135deg,#315e63,#91a79a,#d4b78c)">普罗维亚</span><span class="name">富士 普罗维亚 100F</span></button>
            <button class="film" data-profile="superia400"><span class="swatch" style="background:linear-gradient(135deg,#3d765d,#8db78a,#d4c8a6)">超级</span><span class="name">富士 超级 400</span></button>
            <button class="film" data-profile="cinestill"><span class="swatch" style="background:linear-gradient(135deg,#2d5568,#b44e42,#d8b4a1)">夜光</span><span class="name">电影 夜光 800T</span></button>
            <button class="film" data-profile="vision250d"><span class="swatch" style="background:linear-gradient(135deg,#536f6b,#be8b62,#d7c3a1)">250D</span><span class="name">电影 Vision3 250D</span></button>
            <button class="film" data-profile="hp5"><span class="swatch" style="background:linear-gradient(135deg,#2a2a28,#84817a,#d6d0c4)">HP5</span><span class="name">伊尔福 HP5 Plus</span></button>
            <button class="film" data-profile="trix"><span class="swatch" style="background:linear-gradient(135deg,#20201f,#6d6b66,#c5c0b6)">Tri-X</span><span class="name">柯达 Tri-X 400</span></button>
            <button class="film" data-profile="delta3200"><span class="swatch" style="background:linear-gradient(135deg,#292a29,#777a78,#cfcfc9)">Delta</span><span class="name">伊尔福 Delta 3200</span></button>
          </div>
        </section>

        <section class="controls">
          <div class="categories">
            <button class="category active" data-category="light">光线</button>
            <button class="category" data-category="color">颜色</button>
            <button class="category" data-category="effects">效果</button>
            <button class="category" id="cropButton" style="margin-left:auto;font-size:14px">⌗</button>
            <button class="category" id="textButton" style="font-size:14px">T</button>
          </div>
          <div class="tool-row">
            <button class="tool show active" data-tool="exposure" data-cat="light">曝光</button>
            <button class="tool show" data-tool="contrast" data-cat="light">对比</button>
            <button class="tool show" data-tool="highlights" data-cat="light">高光</button>
            <button class="tool show" data-tool="shadows" data-cat="light">阴影</button>
            <button class="tool show" data-tool="whites" data-cat="light">白色</button>
            <button class="tool show" data-tool="blacks" data-cat="light">黑色</button>
            <button class="tool" data-tool="temperature" data-cat="color">色温</button>
            <button class="tool" data-tool="tint" data-cat="color">色调</button>
            <button class="tool" data-tool="vibrance" data-cat="color">自然饱和</button>
            <button class="tool" data-tool="saturation" data-cat="color">饱和</button>
            <button class="tool" data-tool="intensity" data-cat="effects">强度</button>
            <button class="tool" data-tool="clarity" data-cat="effects">清晰度</button>
            <button class="tool" data-tool="sharpness" data-cat="effects">锐化</button>
            <button class="tool" data-tool="fade" data-cat="effects">褪色</button>
            <button class="tool" data-tool="grain" data-cat="effects">颗粒</button>
            <button class="tool" data-tool="vignette" data-cat="effects">暗角</button>
          </div>
          <div class="slider-row"><input id="slider" type="range" min="-200" max="200" value="12"><output id="value">+0.1</output></div>
        </section>
      </main>
    </div>

    <div class="overlay" id="overlay"></div>
    <section class="sheet" id="exportSheet">
      <div class="grab"></div>
      <div class="sheet-title"><div><h2>导出</h2><p>原始尺寸 · 最高质量</p></div><button class="close" id="closeExport">✕</button></div>
      <div class="facts"><div class="fact"><strong id="dims">2172 × 1448</strong><span>输出像素</span></div><div class="sep"></div><div class="fact"><strong id="exportFilm">波特拉</strong><span>胶片</span></div><div class="sep"></div><div class="fact"><strong id="formatFact">HEIC</strong><span>格式</span></div></div>
      <div class="formats"><button class="format active" data-format="heic"><strong>HEIC</strong><span>高画质 · 更小体积</span></button><button class="format" data-format="jpeg"><strong>JPEG</strong><span>兼容性最佳</span></button></div>
      <div class="toggle-row"><div><strong>保留相机信息</strong><small>机身、镜头、快门与拍摄时间</small></div><label class="switch"><input type="checkbox" checked><i></i></label></div>
      <div class="toggle-row"><div><strong>保留地址信息</strong><small>GPS 将写入导出文件</small></div><label class="switch"><input type="checkbox" checked><i></i></label></div>
      <button class="export-btn">↗ 导出原始尺寸 <small>HEIC</small></button>
    </section>
    <div class="home-indicator"></div>
  </div>

  <script>
    const profiles={
      neutral:{name:'原图',badge:'原图',filter:'none'},
      portra:{name:'柯达 波特拉 400',badge:'波特拉',filter:'saturate(.88) contrast(.94) sepia(.08) brightness(1.035)'},
      film135t:{name:'135T 街拍',badge:'135T',filter:'saturate(.93) contrast(1.15) brightness(.99) hue-rotate(-3deg)'},
      portra160:{name:'柯达 波特拉 160',badge:'P160',filter:'saturate(.94) contrast(.92) sepia(.06) brightness(1.04)'},
      portra800:{name:'柯达 波特拉 800',badge:'P800',filter:'saturate(.92) contrast(.91) sepia(.10) brightness(1.045)'},
      pro400h:{name:'富士 专业 400H',badge:'400H',filter:'saturate(.78) contrast(.91) sepia(.025) brightness(1.055)'},
      gold:{name:'柯达 金 200',badge:'金200',filter:'saturate(1.14) contrast(1.06) sepia(.16) brightness(1.01)'},
      ektar100:{name:'柯达 艾克塔 100',badge:'艾克塔',filter:'saturate(1.18) contrast(1.10) brightness(1.01)'},
      chrome:{name:'富士 经典正片',badge:'经典',filter:'saturate(.61) contrast(1.14) sepia(.02) brightness(.99)'},
      velvia50:{name:'富士 维尔维亚 50',badge:'维尔维亚',filter:'saturate(1.3) contrast(1.13) brightness(.99)'},
      provia100f:{name:'富士 普罗维亚 100F',badge:'普罗维亚',filter:'saturate(1.13) contrast(1.08) brightness(1.01)'},
      superia400:{name:'富士 超级 400',badge:'超级',filter:'saturate(1.08) contrast(1.03) hue-rotate(-3deg) brightness(1.03)'},
      cinestill:{name:'电影 夜光 800T',badge:'夜光',filter:'saturate(.96) contrast(.97) hue-rotate(6deg) brightness(1.02)'},
      vision250d:{name:'电影 Vision3 250D',badge:'250D',filter:'saturate(.95) contrast(.97) sepia(.07) brightness(1.03)'},
      hp5:{name:'伊尔福 HP5 Plus',badge:'HP5',filter:'grayscale(1) contrast(1.17) brightness(.98)'},
      trix:{name:'柯达 Tri-X 400',badge:'Tri-X',filter:'grayscale(1) contrast(1.24) brightness(.98)'},
      delta3200:{name:'伊尔福 Delta 3200',badge:'Delta',filter:'grayscale(1) contrast(1.08) brightness(1.04)'}
    };
    let activeProfile='portra',activeTool='exposure',activeCategory='light';
    const sliders={
      intensity:[0,100,82,''],
      exposure:[-200,200,12,'EV'],
      contrast:[-100,100,0,''],
      highlights:[-100,100,0,''],
      shadows:[-100,100,0,''],
      whites:[-100,100,0,''],
      blacks:[-100,100,0,''],
      temperature:[3500,9000,6900,'K'],
      tint:[-100,100,0,''],
      vibrance:[-100,100,0,''],
      saturation:[-100,100,0,''],
      clarity:[-100,100,0,''],
      sharpness:[0,100,0,''],
      fade:[0,100,0,''],
      grain:[0,100,18,''],
      vignette:[0,100,0,'']
    };
    const $=s=>document.querySelector(s), photo=$('#photo');
    function setFill(el){const p=(+el.value-+el.min)/(+el.max-+el.min)*100;el.style.setProperty('--p',p+'%')}
    function choose(key){
      activeProfile=key;const p=profiles[key];
      document.documentElement.style.setProperty('--filter',p.filter);
      applyAdjustments();
      $('#filmName').textContent=p.name;$('#profilePill').textContent=p.name;$('#exportFilm').textContent=p.badge;
      document.querySelectorAll('.film').forEach(x=>x.classList.toggle('active',x.dataset.profile===key));
      photo.classList.add('loading');setTimeout(()=>photo.classList.remove('loading'),180);
    }
    document.querySelectorAll('.film').forEach(b=>b.onclick=()=>choose(b.dataset.profile));
    function selectCategory(category){
      activeCategory=category;
      document.querySelectorAll('.category').forEach(x=>x.classList.toggle('active',x.dataset.category===category));
      const tools=[...document.querySelectorAll('.tool')];
      tools.forEach(x=>x.classList.toggle('show',x.dataset.cat===category));
      const first=tools.find(x=>x.dataset.cat===category);
      if(first) selectTool(first);
    }
    function selectTool(button){
      activeTool=button.dataset.tool;
      document.querySelectorAll('.tool').forEach(x=>x.classList.toggle('active',x===button));
      const s=sliders[activeTool],slider=$('#slider');
      slider.min=s[0];slider.max=s[1];slider.value=s[2];setFill(slider);updateValue();
    }
    document.querySelectorAll('.category').forEach(b=>b.onclick=()=>selectCategory(b.dataset.category));
    document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>{
      selectTool(b);
    });
    function applyAdjustments(){
      const exposure=sliders.exposure[2]/100;
      const contrast=sliders.contrast[2]/100;
      const saturation=sliders.saturation[2]/100;
      $('#editedPhoto').style.filter=`${profiles[activeProfile].filter} brightness(${1+exposure*.18}) contrast(${1+contrast*.45}) saturate(${1+saturation})`;
    }
    function updateValue(){
      const s=sliders[activeTool],v=+$('#slider').value;
      if(activeTool==='exposure')$('#value').textContent=(v>=0?'+':'')+(v/100).toFixed(1);
      else if(activeTool==='temperature')$('#value').textContent=v+'K';
      else $('#value').textContent=(v>0?'+':'')+v;
    }
    $('#slider').oninput=()=>{setFill($('#slider'));updateValue();sliders[activeTool][2]=+$('#slider').value;applyAdjustments();photo.classList.add('loading');setTimeout(()=>photo.classList.remove('loading'),100)};
    $('#holdOriginal').addEventListener('pointerdown',()=>{photo.classList.add('holding')});
    ['pointerup','pointercancel','pointerleave'].forEach(e=>$('#holdOriginal').addEventListener(e,()=>photo.classList.remove('holding')));
    $('#recommend').onclick=()=>{$('#recommend').textContent='分析中';photo.classList.add('loading');setTimeout(()=>{choose('film135t');$('#recommend').textContent='✦ 推荐';photo.classList.remove('loading')},650)};
    $('#reset').onclick=()=>choose(activeProfile);
    $('#backHome').onclick=()=>{$('#fileInput').value='';document.querySelector('.workspace').style.opacity='.18';setTimeout(()=>document.querySelector('.workspace').style.opacity='1',350)};
    $('#openExport').onclick=()=>$('#phone').classList.add('sheet-open');
    $('#closeExport').onclick=$('#overlay').onclick=()=>$('#phone').classList.remove('sheet-open');
    document.querySelectorAll('.format').forEach(b=>b.onclick=()=>{document.querySelectorAll('.format').forEach(x=>x.classList.toggle('active',x===b));const t=b.querySelector('strong').textContent;$('#formatFact').textContent=t;document.querySelector('.export-btn small').textContent=t});
    $('#filesButton').onclick=()=>$('#fileInput').click();
    $('#histogramButton').onclick=()=>{const h=document.querySelector('.histogram');const hidden=h.style.display==='none';h.style.display=hidden?'block':'none';$('#histogramButton').style.color=hidden?'var(--accent)':'var(--muted)'};
    $('#infoButton').onclick=()=>alert('图片信息：2172 × 1448 · 3.1 MP · 2.4 MB · SONY ZV-E10');
    $('#cropButton').onclick=()=>alert('完整裁剪与构图工具在 iOS App 中打开。');
    $('#textButton').onclick=()=>alert('完整文字与 Emoji 工具在 iOS App 中打开。');
    $('#copyPreset').onclick=()=>$('#copyPreset').textContent='已复制';
    $('#pastePreset').onclick=()=>choose('portra');
    $('#fileInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const ext=f.name.split('.').pop().toUpperCase();if(ext==='ARW'){alert('浏览器原型不能解码 ARW；请使用 iOS 1.1 测试版。');return}const url=URL.createObjectURL(f);$('#editedPhoto').src=url;$('#originalPhoto').src=url;const i=new Image();i.onload=()=>{$('#dims').textContent=i.naturalWidth+' × '+i.naturalHeight};i.src=url};
    setFill($('#slider'));updateValue();
  </script>
</body>
</html>
